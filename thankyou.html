<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danke!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lato', sans-serif;
    background: linear-gradient(135deg, #1f3b2c 0%, #2c4a37 50%, #1f3b2c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #f7f1e6;
    text-align: center;
  }
  .card {
    max-width: 480px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(212,175,110,0.4);
    border-radius: 16px;
    padding: 48px 32px;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #d4af6e;
    margin-bottom: 16px;
  }
  p { font-size: 16px; line-height: 1.6; color: #e9e2d3; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💌</div>
    <h1>Vielen Dank!</h1>
    <p>Deine Antworten wurden erfolgreich versendet.<br>Das ist ein wunderschönes Geschenk für Katharina &amp; Jay.</p>
  </div>
</body>
</html>
